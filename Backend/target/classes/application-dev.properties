# --- Server ---
server.port=8080

# --- H2 in-memory DB (dev only) ---
spring.datasource.url=jdbc:mysql://coms-3090-026.class.las.iastate.edu:3306/questbuddy?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Chicago&useLegacyDatetimeCode=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# auto-create/update tables from JPA entities
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 web console for quick peeks
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
